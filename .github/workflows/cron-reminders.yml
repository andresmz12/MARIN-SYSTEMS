name: Cron Reminders

on:
  schedule:
    - cron: "30 13 * * *"   # morning  — 8:30 AM Colombia (UTC-5)
    - cron: "0 17 * * *"    # midday   — 12:00 PM Colombia
    - cron: "0 23 * * *"    # evening  — 6:00 PM Colombia
    - cron: "0 */6 * * *"   # generate — cada 6 horas
    - cron: "0 13 * * 1"   # weekly-angles — lunes 8:00 AM Colombia (UTC-5)
    - cron: "0 14 * * 0"   # auto-content — domingos 9:00 AM COL; genera los posts de L/X/V
    - cron: "10 18-23 * * 1-5"   # publish-due — L-V 1:10-6:10 PM COL, cada hora; publica lo aprobado cuya hora ya llegó
  workflow_dispatch:         # permite correrlo manualmente desde GitHub Actions
    inputs:
      job:
        description: 'Qué tarea ejecutar ("all" corre TODAS, incluidos los recordatorios por correo)'
        type: choice
        default: auto-content
        options:
          - auto-content
          - publish-due
          - weekly-angles
          - generate
          - morning
          - midday
          - evening
          - all

jobs:
  morning:
    name: Morning Reminder (8:30 AM COL)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'morning')) || github.event.schedule == '30 13 * * *'
    steps:
      - name: POST /cron/morning
        run: |
          curl --fail -s -X POST \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/corporate-tasks/cron/morning

  midday:
    name: Midday Reminder (12:00 PM COL)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'midday')) || github.event.schedule == '0 17 * * *'
    steps:
      - name: POST /cron/midday
        run: |
          curl --fail -s -X POST \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/corporate-tasks/cron/midday

  evening:
    name: Evening Reminder (6:00 PM COL)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'evening')) || github.event.schedule == '0 23 * * *'
    steps:
      - name: POST /cron/evening
        run: |
          curl --fail -s -X POST \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/corporate-tasks/cron/evening

  generate:
    name: Generate Recurring Instances (every 6h)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'generate')) || github.event.schedule == '0 */6 * * *'
    steps:
      - name: POST /cron/generate
        run: |
          curl --fail -s -X POST \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/corporate-tasks/cron/generate

  weekly-angles:
    name: Weekly Content Angles (Mon 8:00 AM COL)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'weekly-angles')) || github.event.schedule == '0 13 * * 1'
    steps:
      - name: POST /ceo/cron/weekly-angles
        run: |
          curl --fail -s -X POST \
            --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/ceo/cron/weekly-angles

  auto-content:
    name: Auto Content (Sun 9:00 AM COL, posts for Mon/Wed/Fri)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'auto-content')) || github.event.schedule == '0 14 * * 0'
    steps:
      - name: POST /ceo/cron/auto-content
        run: |
          curl --fail -s -X POST \
            --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/ceo/cron/auto-content

  publish-due:
    name: Publish Due Posts (Mon-Fri evenings)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'publish-due')) || github.event.schedule == '10 18-23 * * 1-5'
    steps:
      - name: POST /ceo/cron/publish-due
        run: |
          curl --fail -s -X POST \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://marin-systems-production.up.railway.app/api/ceo/cron/publish-due
