[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npx prisma db push --accept-data-loss && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/api/auth/session"
timeout = 30

# Los cronjobs se manejan desde GitHub Actions (.github/workflows/cron-reminders.yml)
# Railway no reconoce la sección [cronjobs.*] en railway.toml
