[build]
builder = "NIXPACKS"
buildCommand = "NODE_ENV=production npm ci && rm -rf .next && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/api/auth/session"
timeout = 30
